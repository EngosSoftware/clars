[package]
name = "clars"
version = "0.4.0-rc.0"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "Command-line arguments resolver"
documentation = "https://docs.rs/clars"
repository = "https://github.com/EngosSoftware/clars.git"
keywords = ["command", "line", "arguments", "resolver"]
categories = ["command-line-utilities"]
license = "MIT OR Apache-2.0"
edition = "2024"
include = [
    "src/**",
    "tests/**",
    "docs/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]

[dependencies]
antex = "0.2.3"
